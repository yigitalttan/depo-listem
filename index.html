<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Depo Listesi">
<title>Depo Listesi</title>
<style>
  :root {
    --bg: #121212;
    --card: #1c1c1e;
    --card-border: #2c2c2e;
    --btn-bg: #2c2c2e;
    --text: #ffffff;
    --sub: #8e8e93;
    --accent: #e06c53;
    --green: #32d74b;
    --red: #ff453a;
    --blue: #0a84ff;
    --orange: #ff9f0a;
    --purple: #bf5af2;
    --teal: #5ac8fa;
  }
  * { 
    box-sizing: border-box; 
    -webkit-tap-highlight-color: transparent; 
    touch-action: pan-y;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; 
  }
  html, body { 
    margin: 0; 
    background: var(--bg); 
    color: var(--text); 
    padding-bottom: calc(100px + env(safe-area-inset-bottom));
    overscroll-behavior-y: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* Üst Alan - iPhone Çentik / Dynamic Island Korumalı */
  .header { 
    padding: calc(14px + env(safe-area-inset-top)) 14px 10px 14px; 
    background: rgba(18,18,18,0.95); 
    backdrop-filter: blur(12px); 
    position: sticky; 
    top: 0; 
    z-index: 20; 
    border-bottom: 1px solid #252528; 
  }
  .header-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .title-area h1 { margin: 0 0 3px 0; font-size: 23px; font-weight: 700; letter-spacing: -0.5px; }
  .stats { font-size: 13px; color: var(--sub); line-height: 1.4; }
  .stats b { color: #e5e5ea; font-weight: 600; }
  .stats .out-stat { color: var(--red); }

  .wake-btn { background: var(--btn-bg); color: var(--sub); border: 1px solid #3a3a3c; padding: 9px 12px; border-radius: 10px; font-size: 12px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; white-space: nowrap; flex-shrink: 0; }
  .wake-btn.active { background: #332700; color: var(--orange); border-color: var(--orange); }

  /* Arama Kutusu */
  .search-wrap { margin-top: 10px; position: relative; }
  .search-inp { width: 100%; background: #1c1c1e; border: 1px solid #333; color: var(--text); padding: 10px 34px 10px 12px; border-radius: 10px; font-size: 15px; -webkit-user-select: text; user-select: text; }
  .search-inp::placeholder { color: #636366; }
  .search-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: #3a3a3c; color: #fff; border: none; width: 20px; height: 20px; border-radius: 50%; font-size: 12px; display: none; align-items: center; justify-content: center; cursor: pointer; }

  /* Yatay Aksiyon ve Filtre Butonları - Sağa Sola Akıcı Kaydırma */
  .scroll-row { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 10px 0 2px 0; scrollbar-width: none; touch-action: pan-x; }
  .scroll-row * { touch-action: pan-x; }
  .scroll-row::-webkit-scrollbar { display: none; }
  
  .pill-btn { background: var(--btn-bg); color: var(--text); border: 1px solid #3a3a3c; padding: 7px 12px; border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .pill-btn.add-primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  .pill-btn.out-active { background: var(--red); color: #fff; border-color: var(--red); }
  .pill-btn.bulk-unit { background: #261b33; color: #d68fff; border-color: #4c2d6e; }
  .pill-btn.bulk-unit:active { background: #4c2d6e; }
  .pill-btn.reset { background: transparent; color: var(--accent); border-color: var(--accent); }
  .pill-btn.wa { background: #163320; color: var(--green); border-color: #245233; }

  /* Kategori Sekmeleri */
  .cat-tabs { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 8px 14px 4px 14px; scrollbar-width: none; touch-action: pan-x; }
  .cat-tabs * { touch-action: pan-x; }
  .cat-tabs::-webkit-scrollbar { display: none; }
  .cat-tab { background: #1c1c1e; color: var(--sub); border: 1px solid #2c2c2e; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .cat-tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }

  /* Kartlar */
  .content { padding: 4px 14px; position: relative; }
  .category-title { font-size: 12px; font-weight: 700; color: var(--sub); text-transform: uppercase; letter-spacing: 0.8px; margin: 18px 0 8px 2px; }
  
  .card { 
    background: var(--card); 
    border: 1px solid var(--card-border); 
    border-radius: 16px; 
    padding: 10px; 
    display: flex; 
    align-items: center; 
    gap: 9px; 
    margin-bottom: 10px; 
    will-change: transform;
  }
  .card.checked { opacity: 0.5; border-color: var(--green); }
  .card.out-of-stock { border-color: var(--red); background: #241616; }

  /* Taşınan Kartın Belirgin Vurgusu */
  .card.moving-active {
    border-color: #3898ff;
    background-color: #19293d;
    box-shadow: 0 8px 22px rgba(10, 132, 255, 0.28);
    z-index: 15;
    position: relative;
  }

  .prod-img-wrap { width: 64px; height: 74px; border-radius: 10px; background: #2c2c2e; flex-shrink: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; color: var(--sub); font-size: 11px; text-align: center; cursor: pointer; border: 1px solid #333; }
  .prod-img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.1s; }

  .prod-mid { flex: 1; min-width: 0; }
  .prod-name { font-size: 15px; font-weight: 600; margin-bottom: 8px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .card.checked .prod-name { text-decoration: line-through; color: var(--sub); }

  .controls-row { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
  .stepper { display: flex; align-items: center; gap: 4px; }
  
  /* Renkli Artı / Eksi Butonları */
  .step-btn { width: 38px; height: 36px; border-radius: 9px; font-size: 21px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; transition: transform 0.08s; }
  .step-btn.minus { background: #331919; border: 1px solid #662929; color: #ff6961; }
  .step-btn.plus { background: #163320; border: 1px solid #265c38; color: #4cd964; }
  .step-btn.pressing { transform: scale(0.92); filter: brightness(1.3); }

  .step-val { min-width: 34px; height: 36px; border-radius: 9px; background: #252528; border: 1px solid #38383c; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--text); padding: 0 4px; flex-shrink: 0; }
  .step-val.has-qty { color: var(--orange); border-color: #ff9f0a88; background: #2b2214; }

  /* Renkli Birim Rozeti (Adet / Koli / Paket) */
  .unit-badge { height: 36px; padding: 0 7px; border-radius: 9px; background: #261b33; border: 1px solid #4c2d6e; color: #d68fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .unit-badge.is-koli { background: #2e2112; border-color: #66461d; color: #ffb340; }
  .unit-badge.is-paket { background: #162a33; border-color: #295266; color: #5ac8fa; }
  .unit-badge:active { filter: brightness(1.25); }

  /* Renkli Yukarı / Aşağı Sıralama Okları */
  .move-group { display: flex; gap: 3px; margin-left: 1px; flex-shrink: 0; }
  .move-mini { width: 26px; height: 36px; border-radius: 8px; border: 1px solid #294666; background: #182738; color: #5ac8fa; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .move-mini:active { background: var(--blue); color: #fff; border-color: var(--blue); }

  /* Sağ Durum Butonları (Tik ve Depoda Yok X) */
  .status-col { display: flex; flex-direction: column; gap: 7px; align-items: center; flex-shrink: 0; }
  .check-circle { width: 40px; height: 40px; border-radius: 50%; border: 2px solid #48484a; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 19px; color: transparent; }
  .card.checked .check-circle { background: var(--green); border-color: var(--green); color: #000; font-weight: bold; }

  .out-btn { width: 32px; height: 24px; border-radius: 7px; border: 1px solid #3a3a3c; background: #252528; color: var(--sub); font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .card.out-of-stock .out-btn { background: var(--red); border-color: var(--red); color: #fff; }

  .empty-msg { text-align: center; color: var(--sub); margin-top: 50px; font-size: 14px; line-height: 1.5; padding: 0 20px; }

  /* Modal - Arka Plan Kaydırma Kilidi */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.78); display: none; align-items: flex-end; z-index: 50; overscroll-behavior: contain; touch-action: none; }
  .modal.open { display: flex; }
  .sheet { background: #1c1c1e; width: 100%; border-radius: 22px 22px 0 0; padding: 20px 20px calc(24px + env(safe-area-inset-bottom)) 20px; border-top: 1px solid #333; max-height: 92vh; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; touch-action: pan-y; }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .sheet-head h2 { margin: 0; font-size: 18px; }
  .link-btn { background: none; border: none; font-size: 16px; color: var(--blue); font-weight: 600; cursor: pointer; }

  .preview-area { width: 100%; height: 150px; border-radius: 12px; background: #2c2c2e; display: flex; align-items: center; justify-content: center; color: var(--sub); margin-bottom: 8px; overflow: hidden; position: relative; }
  .preview-area img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.08s; }
  .clear-img-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.75); color: #fff; border: 1px solid #555; border-radius: 8px; padding: 5px 9px; font-size: 11px; cursor: pointer; z-index: 2; }

  /* Görsel Büyütme / Küçültme Çubuğu */
  .zoom-bar { display: none; align-items: center; gap: 10px; background: #252528; padding: 8px 12px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #3a3a3c; }
  .zoom-bar.visible { display: flex; }
  .zoom-bar span { font-size: 12px; color: #d1d1d6; font-weight: 600; white-space: nowrap; }
  .zoom-bar input[type="range"] { flex: 1; accent-color: var(--blue); height: 24px; }
  .zoom-reset-btn { background: #3a3a3c; color: #fff; border: none; border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer; }
  
  .photo-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .photo-lbl { flex: 1; background: #2c2c2e; color: var(--blue); padding: 10px 6px; border-radius: 10px; text-align: center; font-weight: 600; font-size: 13px; cursor: pointer; border: 1px solid #3a3a3c; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .photo-lbl.web-search { background: #1a2a3a; color: #5ac8fa; border-color: #2c4a66; }
  input[type="file"] { display: none; }

  /* Tek Dokunuş Yapıştırma Kutusu */
  .url-row { display: flex; gap: 6px; margin-bottom: 14px; }
  .url-inp { flex: 1; min-width: 0; padding: 10px 10px; border-radius: 10px; border: 1px solid #3a3a3c; background: #2c2c2e; color: white; font-size: 13px; -webkit-user-select: text; user-select: text; }
  .url-paste-btn { background: #2c2c2e; color: #5ac8fa; border: 1px solid #3a3a3c; border-radius: 10px; padding: 0 11px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .url-paste-btn:active { background: #3a3a3c; }
  .url-apply-btn { background: var(--blue); color: #fff; border: none; border-radius: 10px; padding: 0 12px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }

  .inp-group { margin-bottom: 12px; }
  .inp-group label { display: block; font-size: 11px; color: var(--sub); margin-bottom: 5px; font-weight: 600; text-transform: uppercase; }
  .inp-group input, .inp-group select { width: 100%; padding: 11px; border-radius: 10px; border: 1px solid #3a3a3c; background: #2c2c2e; color: white; font-size: 15px; -webkit-user-select: text; user-select: text; }

  .del-btn { width: 100%; padding: 13px; background: #3a1c1c; color: var(--red); border: none; border-radius: 12px; font-size: 15px; font-weight: 600; margin-top: 10px; cursor: pointer; }

  .backup-box { display: flex; flex-direction: column; gap: 12px; }
  .backup-btn { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #3a3a3c; background: #2c2c2e; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; text-align: center; }
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="title-area">
      <h1>Depo Listesi</h1>
      <div class="stats" id="statsText">Getirilecek: <b>0</b> · Alınan: <b>0</b></div>
    </div>
    <button class="wake-btn" id="wakeBtn" onclick="toggleWakeLock()">☀️ Ekran Açık: Kapalı</button>
  </div>

  <div class="search-wrap">
    <input type="text" class="search-inp" id="searchInp" placeholder="Ürün ara..." oninput="onSearch()">
    <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
  </div>

  <div class="scroll-row">
    <button class="pill-btn add-primary" onclick="openModal()">+ Ürün Ekle</button>
    <button class="pill-btn" id="filterOutBtn" onclick="toggleOutFilter()">Depoda Yoklar</button>
    <button class="pill-btn bulk-unit" onclick="setAllUnits('Adet')">Hepsi Adet</button>
    <button class="pill-btn bulk-unit" onclick="setAllUnits('Koli')">Hepsi Koli</button>
    <button class="pill-btn wa" onclick="shareWhatsApp()">WhatsApp</button>
    <button class="pill-btn" onclick="openBackupModal()">Yedek</button>
    <button class="pill-btn reset" onclick="resetList()">Yeni liste</button>
  </div>
</div>

<div class="cat-tabs" id="catTabs"></div>
<div class="content" id="appContent"></div>

<!-- Ürün Ekle / Düzenle Modal -->
<div class="modal" id="modal">
  <div class="sheet">
    <div class="sheet-head">
      <button class="link-btn" style="color:var(--sub)" onclick="closeModal()">İptal</button>
      <h2 id="modalTitle">Ürün Ekle</h2>
      <button class="link-btn" onclick="saveProduct()">Kaydet</button>
    </div>

    <div class="preview-area" id="imgPreview">Fotoğraf Seçilmedi</div>
    
    <!-- Görsel Büyütme / Küçültme Kontrolü -->
    <div class="zoom-bar" id="zoomBar">
      <span>🔍 Boyut:</span>
      <input type="range" id="zoomSlider" min="0.7" max="2.5" step="0.05" value="1" oninput="onZoomChange(this.value)">
      <span id="zoomLabel">%100</span>
      <button type="button" class="zoom-reset-btn" onclick="resetZoom()">Sıfırla</button>
    </div>

    <div class="photo-row">
      <label class="photo-lbl">📷 Kamera<input type="file" accept="image/*" capture="environment" onchange="processImg(event)"></label>
      <label class="photo-lbl">🖼️ Galeri<input type="file" accept="image/*" onchange="processImg(event)"></label>
      <button type="button" class="photo-lbl web-search" onclick="searchGoogleImages()">🔍 İnternette Ara</button>
    </div>

    <div class="url-row">
      <button type="button" class="url-paste-btn" onclick="pasteImageUrl()">📋 Yapıştır</button>
      <input type="url" class="url-inp" id="imgUrlInput" placeholder="Bağlantıyı yapıştırın..." oninput="onUrlTyped(this.value)">
      <button type="button" class="url-apply-btn" onclick="applyImageUrl()">Ekle</button>
    </div>

    <div class="inp-group">
      <label>Kategori</label>
      <input type="text" id="catInput" placeholder="Örn: KOLA, SPRİTE, FANTA" list="catSuggestions">
      <datalist id="catSuggestions"></datalist>
    </div>

    <div class="inp-group">
      <label>Ürün Adı</label>
      <input type="text" id="nameInput" placeholder="Örn: Coca-Cola 2,5 L">
    </div>

    <div class="inp-group">
      <label>Varsayılan Birim</label>
      <select id="unitInput">
        <option value="Adet">Adet</option>
        <option value="Koli">Koli</option>
        <option value="Paket">Paket</option>
      </select>
    </div>

    <button class="del-btn" id="delBtn" onclick="deleteProduct()" style="display:none;">Bu Ürünü Sil</button>
  </div>
</div>

<!-- Yedekleme Modal -->
<div class="modal" id="backupModal">
  <div class="sheet">
    <div class="sheet-head">
      <button class="link-btn" style="color:var(--sub)" onclick="closeBackupModal()">Kapat</button>
      <h2>Yedekleme</h2>
      <span style="width:40px"></span>
    </div>
    <p style="font-size:13px; color:var(--sub); margin-top:0; line-height:1.5;">
      Tüm ürünlerinizi ve fotoğraflarınızı tek bir dosya olarak telefonunuza indirebilir veya daha önce aldığınız yedeği geri yükleyebilirsiniz.
    </p>
    <div class="backup-box">
      <button class="backup-btn" style="background:var(--blue); border-color:var(--blue);" onclick="exportBackup()">⬇️ Yedeği İndir (Dosya Olarak Kaydet)</button>
      <label class="backup-btn">⬆️ Yedekten Geri Yükle<input type="file" accept=".json" onchange="importBackup(event)"></label>
    </div>
  </div>
</div>

<script>
  document.addEventListener('gesturestart', e => e.preventDefault());

  // Ekran Açık Tutma (Wake Lock)
  let wakeLock = null;
  let isWakeActive = false;

  async function toggleWakeLock() {
    const btn = document.getElementById('wakeBtn');
    if (!isWakeActive) {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
        isWakeActive = true;
        btn.classList.add('active');
        btn.innerText = '☀️ Ekran Açık: Açık';
      } catch (err) {
        alert('Tarayıcınız ekran açık tutma özelliğini kısıtlıyor.');
      }
    } else {
      if (wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
      isWakeActive = false;
      btn.classList.remove('active');
      btn.innerText = '☀️ Ekran Açık: Kapalı';
    }
  }

  document.addEventListener('visibilitychange', async () => {
    if (isWakeActive && document.visibilityState === 'visible' && 'wakeLock' in navigator) {
      try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    }
  });

  let saveTimer = null;

  function saveImmediate() {

  function updateStats() {

  function getUnitClass(unit) {

      return true;

    if (visible.length === 0) {

    const groups = {};

      if (!groups[cat]) groups[cat] = [];
      groups[cat].push(p);

    let html = '';
    for (const [cat, items] of Object.entries(groups)) {
      html += `<div class="category-title">${cat}</div>`;
      items.forEach(p => {

          <div class="card ${p.checked ? 'checked' : ''} ${p.outOfStock ? 'out-of-stock' : ''}" id="card-${p.id}">

                ? `<img src="${p.img}" style="transform: scale(${z});" onerror="this.onerror=null; this.src=''; this.alt='Hata';">` 
                : `Fotoğraf<br>Ekle`}

                  <div class="step-val ${p.qty > 0 ? 'has-qty' : ''}" id="qty-${p.id}">${p.qty}</div>
                  <button class="step-btn plus" data-action="step" data-id="${p.id}" data-delta="1">+</button>

                <div class="move-group">
                  <button class="move-mini" title="Yukarı Taşı" data-action="move" data-id="${p.id}" data-dir="-1">▲</button>
                  <button class="move-mini" title="Aşağı Taşı" data-action="move" data-id="${p.id}" data-dir="1">▼</button>
                </div>
              </div>

            <div class="status-col">
              <button class="check-circle" data-action="check" data-id="${p.id}">✓</button>
              <button class="out-btn" title="Depoda Yok" data-action="out" data-id="${p.id}">✕</button>

  // Tüm Ürünlerin Birimini Toplu Değiştirme (Hepsi Adet / Hepsi Koli)
  function setAllUnits(targetUnit) {
    products.forEach(p => { p.unit = targetUnit; });
    saveImmediate();
  }

  // Kaydırma Korumalı Akıllı Dokunma Kontrolü
  const appContent = document.getElementById('appContent');
  let touchStartX = 0;
  let touchStartY = 0;
  let isScrolling = false;
  let activeBtn = null;
  let holdTimeout = null;
  let holdInterval = null;

  function clearTimers() {
    clearTimeout(holdTimeout);
    clearInterval(holdInterval);
    if (activeBtn) {
      activeBtn.classList.remove('pressing');
      activeBtn = null;
    }
  }

  appContent.addEventListener('pointerdown', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    if (e.button !== undefined && e.button !== 0) return;

    touchStartX = e.clientX;
    touchStartY = e.clientY;
    isScrolling = false;
    activeBtn = btn;

    const action = btn.dataset.action;
    const id = btn.dataset.id;

    if (action === 'step') {
      const delta = parseInt(btn.dataset.delta, 10);
      btn.classList.add('pressing');
      holdTimeout = setTimeout(() => {
        if (!isScrolling && activeBtn === btn) {
          changeQtyFast(id, delta);
          holdInterval = setInterval(() => {
            if (!isScrolling) changeQtyFast(id, delta);
          }, 95);
        }
      }, 280);
    }
  });

  appContent.addEventListener('pointermove', (e) => {
    if (!activeBtn) return;
    const dx = Math.abs(e.clientX - touchStartX);
    const dy = Math.abs(e.clientY - touchStartY);
    if (dx > 8 || dy > 8) {
      isScrolling = true;
      clearTimers();
    }
  });

  appContent.addEventListener('pointerup', (e) => {
    if (!activeBtn) return;
    const btn = activeBtn;
    const wasScrolling = isScrolling;
    const wasHolding = holdInterval !== null;
    clearTimers();

    if (wasScrolling || wasHolding) return;

    const action = btn.dataset.action;
    const id = btn.dataset.id;

    if (action === 'step') {
      changeQtyFast(id, parseInt(btn.dataset.delta, 10));
    } else if (action === 'unit') {
      cycleUnit(id);
    } else if (action === 'check') {
      toggleCheck(id);
    } else if (action === 'out') {
      toggleOut(id);
    } else if (action === 'move') {
      moveProductAnimated(id, parseInt(btn.dataset.dir, 10));
    }
  });

  appContent.addEventListener('pointercancel', clearTimers);

  // 0.5 Saniyelik Fiziksel Yer Değiştirme (FLIP) Animasyonu
  function moveProductAnimated(id, dir) {
    if (isAnimatingMove) return;
    const idx = products.findIndex(x => x.id === id);
    if (idx === -1) return;
    const targetCat = (products[idx].category || 'GENEL').toUpperCase();

    let swapIdx = -1;
    if (dir === -1) {
      for (let i = idx - 1; i >= 0; i--) {
        if ((products[i].category || 'GENEL').toUpperCase() === targetCat) {
          swapIdx = i;
          break;
        }
      }
    } else {
      for (let i = idx + 1; i < products.length; i++) {
        if ((products[i].category || 'GENEL').toUpperCase() === targetCat) {
          swapIdx = i;
          break;
        }
      }
    }

    if (swapIdx === -1) return;

    const swapId = products[swapIdx].id;
    const el1 = document.getElementById(`card-${id}`);
    const el2 = document.getElementById(`card-${swapId}`);

    // İlk konumları kaydet (First)
    const rect1First = el1 ? el1.getBoundingClientRect() : null;
    const rect2First = el2 ? el2.getBoundingClientRect() : null;

    // Dizide yer değiştir ve kaydet
    const temp = products[idx];
    products[idx] = products[swapIdx];
    products[swapIdx] = temp;
    
    clearTimeout(saveTimer);
    try {
      localStorage.setItem('depo_katalog_v2', JSON.stringify(products));
    } catch (e) {}
    render();

    // Yeni DOM elemanlarını bul ve fark kadar geri çekip 0.5s kaydır (Last, Invert, Play)
    const newEl1 = document.getElementById(`card-${id}`);
    const newEl2 = document.getElementById(`card-${swapId}`);

    if (rect1First && rect2First && newEl1 && newEl2) {
      isAnimatingMove = true;
      const rect1Last = newEl1.getBoundingClientRect();
      const rect2Last = newEl2.getBoundingClientRect();

      const deltaY1 = rect1First.top - rect1Last.top;
      const deltaY2 = rect2First.top - rect2Last.top;

      newEl1.classList.add('moving-active');
      newEl1.style.transition = 'none';
      newEl2.style.transition = 'none';
      newEl1.style.transform = `translateY(${deltaY1}px) scale(1.03)`;
      newEl2.style.transform = `translateY(${deltaY2}px)`;

      // Tarayıcıya başlangıç karesini çizdir
      newEl1.offsetHeight;

      newEl1.style.transition = 'transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.5s ease, border-color 0.5s ease';
      newEl2.style.transition = 'transform 0.5s cubic-bezier(0.22, 1, 0.36, 1)';
      newEl1.style.transform = 'translateY(0) scale(1)';
      newEl2.style.transform = 'translateY(0)';

      setTimeout(() => {
        if (newEl1) {
          newEl1.classList.remove('moving-active');
          newEl1.style.transition = '';
          newEl1.style.transform = '';
        }
        if (newEl2) {
          newEl2.style.transition = '';
          newEl2.style.transform = '';
        }
        isAnimatingMove = false;
      }, 520);
    }
  }

  function changeQtyFast(id, delta) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    p.qty = Math.max(0, p.qty + delta);
    if (p.qty === 0) p.checked = false;

    const qtyEl = document.getElementById(`qty-${id}`);
    const cardEl = document.getElementById(`card-${id}`);
    if (qtyEl) {
      qtyEl.textContent = p.qty;
      if (p.qty > 0) qtyEl.classList.add('has-qty');
      else qtyEl.classList.remove('has-qty');
    }
    if (cardEl && !p.checked) {
      cardEl.classList.remove('checked');
    }

    updateStats();
    saveDeferred();
  }

  function cycleUnit(id) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    const idx = units.indexOf(p.unit || 'Adet');
    p.unit = units[(idx + 1) % units.length];
    
    const unitEl = document.getElementById(`unit-${id}`);
    if (unitEl) {
      unitEl.textContent = p.unit;
      unitEl.className = `unit-badge ${getUnitClass(p.unit)}`;
    }
    saveDeferred();
  }

  function toggleCheck(id) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    p.checked = !p.checked;
    if (p.checked) p.outOfStock = false;
    
    const cardEl = document.getElementById(`card-${id}`);
    if (cardEl) {
      cardEl.classList.toggle('checked', p.checked);
      cardEl.classList.remove('out-of-stock');
    }
    updateStats();
    saveDeferred();
  }

  function toggleOut(id) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    p.outOfStock = !p.outOfStock;
    if (p.outOfStock) p.checked = false;

    const cardEl = document.getElementById(`card-${id}`);
    if (cardEl) {
      cardEl.classList.toggle('out-of-stock', p.outOfStock);
      cardEl.classList.remove('checked');
    }
    updateStats();
    saveDeferred();
  }

  function toggleOutFilter() {
    onlyOutFilter = !onlyOutFilter;
    document.getElementById('filterOutBtn').classList.toggle('out-active', onlyOutFilter);
    render();
  }

    if (!confirm('Tüm adetler, tikler ve "Depoda Yok" işaretleri sıfırlansın mı? (Ürünler ve fotoğraflar silinmez)')) return;
    products.forEach(p => { p.qty = 0; p.checked = false; p.outOfStock = false; });

    document.getElementById('filterOutBtn').classList.remove('out-active');

  function shareWhatsApp() {
    const toBring = products.filter(p => p.qty > 0 && !p.checked && !p.outOfStock);
    const outItems = products.filter(p => p.outOfStock);

    if (toBring.length === 0 && outItems.length === 0) {
      alert('Paylaşılacak getirilecek ürün veya depoda yok kaydı bulunmuyor.');
      return;
    }

    let text = '📦 *DEPO LİSTESİ*\n\n';
    if (toBring.length > 0) {
      text += '*Getirilecekler:*\n';
      toBring.forEach(p => {
        text += `• ${p.name} — *${p.qty} ${p.unit || 'Adet'}*\n`;
      });
    }
    if (outItems.length > 0) {
      text += '\n❌ *Depoda Tükenenler (Sipariş):*\n';
      outItems.forEach(p => {
        text += `• ${p.name}\n`;
      });
    }

    const url = `https://wa.me/?text=${encodeURIComponent(text)}`;
    window.open(url, '_blank');
  }

  // Modal İşlemleri
  function openModal(id = null) {
    editingId = id;
    const p = id ? products.find(x => x.id === id) : null;
    
    const cats = [...new Set(products.map(x => x.category).filter(Boolean))];
    document.getElementById('catSuggestions').innerHTML = cats.map(c => `<option value="${c}">`).join('');

    document.getElementById('modalTitle').innerText = p ? 'Ürünü Düzenle' : 'Yeni Ürün Ekle';
    document.getElementById('catInput').value = p ? p.category : (selectedCategory !== 'TÜMÜ' ? selectedCategory : (cats[0] || ''));
    document.getElementById('nameInput').value = p ? p.name : '';
    document.getElementById('unitInput').value = p ? (p.unit || 'Adet') : 'Adet';
    document.getElementById('imgUrlInput').value = (p && p.img && p.img.startsWith('http')) ? p.img : '';
    
    tempImg = p ? p.img : null;
    tempZoom = p && p.zoom ? p.zoom : 1;
    
    document.getElementById('delBtn').style.display = p ? 'block' : 'none';
    
    updatePreview();
    lockBodyScroll();
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal').classList.remove('open');

  function updatePreview() {
    const box = document.getElementById('imgPreview');
    const zoomBar = document.getElementById('zoomBar');
    const slider = document.getElementById('zoomSlider');
    const label = document.getElementById('zoomLabel');

    if (tempImg) {
      box.innerHTML = `<img id="previewImgEl" src="${tempImg}" style="transform: scale(${tempZoom});" onerror="alert('Bu resim bağlantısı açılamadı. Lütfen resmin kendisine basılı tutup Görüntü Bağlantısını Kopyala dediğinizden emin olun.');"><button type="button" class="clear-img-btn" onclick="clearTempImg()">Kaldır</button>`;
      zoomBar.classList.add('visible');
      slider.value = tempZoom;
      label.textContent = `%${Math.round(tempZoom * 100)}`;
    } else {
      box.innerHTML = 'Fotoğraf Eklemek İçin Aşağıdan Seçin';
      zoomBar.classList.remove('visible');
    }
  }

  function onZoomChange(val) {
    tempZoom = parseFloat(val);
    const imgEl = document.getElementById('previewImgEl');
    if (imgEl) imgEl.style.transform = `scale(${tempZoom})`;
    document.getElementById('zoomLabel').textContent = `%${Math.round(tempZoom * 100)}`;
  }

  function resetZoom() {
    tempZoom = 1;
    document.getElementById('zoomSlider').value = 1;
    onZoomChange(1);
  }

  function clearTempImg() {
    tempImg = null;
    tempZoom = 1;
    document.getElementById('imgUrlInput').value = '';
    updatePreview();
  }

  // İnternette Google Görsellerde Ara
  function searchGoogleImages() {
    const prodName = document.getElementById('nameInput').value.trim();
    if (!prodName) {
      alert('Önce aşağıya ürün adını yazın, ardından İnternette Ara butonuna basın.');
      return;
    }
    const query = encodeURIComponent(prodName);
    window.open(`https://www.google.com/search?tbm=isch&q=${query}`, '_blank');
  }

  // Tek Tıkla Panodan Yapıştır ve Ekle
  async function pasteImageUrl() {
    const inp = document.getElementById('imgUrlInput');
    inp.focus();
    
    if (navigator.clipboard && navigator.clipboard.readText) {
      try {
        const text = await navigator.clipboard.readText();
        if (text && text.trim()) {
          inp.value = text.trim();
          applyImageUrl();
          return;
        }
      } catch (err) {}
    }

    try {
      const ok = document.execCommand('paste');
      if (ok && inp.value.trim()) {
        applyImageUrl();
        return;
      }
    } catch (e) {}

    inp.select();
    inp.placeholder = 'Kutuya dokunup Yapıştır deyin...';
  }

  function onUrlTyped(val) {
    const trimmed = val.trim();
    if (trimmed.startsWith('http://') || trimmed.startsWith('https://')) {
      tempImg = trimmed;
      tempZoom = 1;
      updatePreview();
    }
  }

  function applyImageUrl() {
    const url = document.getElementById('imgUrlInput').value.trim();
    if (!url) {
      alert('Lütfen önce resim bağlantısını kutuya yapıştırın.');
      return;
    }
    if (!url.startsWith('http://') && !url.startsWith('https://')) {
      alert('Lütfen geçerli bir internet bağlantısı (https://...) yapıştırın.');
      return;
    }
    tempImg = url;
    tempZoom = 1;
    updatePreview();
  }

  function processImg(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const max = 320;
        let w = img.width, h = img.height;
        if (w > h && w > max) { h *= max / w; w = max; }
        else if (h > max) { w *= max / h; h = max; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        tempImg = canvas.toDataURL('image/jpeg', 0.6);
        tempZoom = 1;
        document.getElementById('imgUrlInput').value = '';
        updatePreview();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  }

  function saveProduct() {
    const cat = document.getElementById('catInput').value.trim() || 'GENEL';
    const name = document.getElementById('nameInput').value.trim();
    const unit = document.getElementById('unitInput').value;
    
    const rawUrl = document.getElementById('imgUrlInput').value.trim();
    if (rawUrl && (rawUrl.startsWith('http://') || rawUrl.startsWith('https://'))) {
      tempImg = rawUrl;
    }

    if (!name) { alert('Lütfen ürün adını yazın.'); return; }

    if (editingId) {
      const p = products.find(x => x.id === editingId);
      p.category = cat;
      p.name = name;
      p.unit = unit;
      p.img = tempImg;
      p.zoom = tempZoom;
    } else {
      products.push({
        id: Date.now().toString(),
        category: cat,
        name: name,
        qty: 0,
        unit: unit,
        checked: false,
        outOfStock: false,
        img: tempImg,
        zoom: tempZoom
      });
    }
    saveImmediate();
    closeModal();
  }

  function deleteProduct() {
    if (!confirm('Bu ürünü katalogdan tamamen silmek istediğinize emin misiniz?')) return;
    products = products.filter(x => x.id !== editingId);
    saveImmediate();
    closeModal();
  }

  // Yedekleme İşlemleri
  function openBackupModal() { 
    lockBodyScroll();
    document.getElementById('backupModal').classList.add('open'); 
  }
  function closeBackupModal() { 
    document.getElementById('backupModal').classList.remove('open'); 
    unlockBodyScroll();
  }

  function exportBackup() {
    const dataStr = JSON.stringify(products);
    const blob = new Blob([dataStr], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const date = new Date().toISOString().slice(0, 10);
    a.href = url;
    a.download = `depo-yedek-${date}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importBackup(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const imported = JSON.parse(ev.target.result);
        if (Array.isArray(imported)) {
          products = imported;
          saveImmediate();
          closeBackupModal();
          alert('Yedek başarıyla geri yüklendi!');
        } else {
          alert('Geçersiz yedek dosyası.');
        }
      } catch (err) {
        alert('Dosya okunamadı.');
      }
    };
    reader.readAsText(file);
  }

  render();
</script>
</body>
</html>
